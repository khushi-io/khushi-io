<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 280" width="900" height="280" role="img" aria-label="Khushi Chile: Python Developer, QA Engineer, AI/ML Builder" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#150d36"/>
      <stop offset="0.55" stop-color="#3a2a8a"/>
      <stop offset="1" stop-color="#7a3fbd"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8be9ff"/>
      <stop offset="1" stop-color="#e0b3ff"/>
    </linearGradient>
  </defs>

  <rect width="900" height="280" rx="22" fill="url(#bg)"/>

  <!-- left network -->
  <g stroke="#ffffff" stroke-opacity="0.28" stroke-width="1.4" stroke-dasharray="4 6" fill="none">
    <line x1="70" y1="70" x2="150" y2="150"><animate attributeName="stroke-dashoffset" from="0" to="-20" dur="2s" repeatCount="indefinite"/></line>
    <line x1="150" y1="150" x2="70" y2="220"><animate attributeName="stroke-dashoffset" from="0" to="-20" dur="2.4s" repeatCount="indefinite"/></line>
    <line x1="70" y1="70" x2="215" y2="85"><animate attributeName="stroke-dashoffset" from="0" to="-20" dur="2.2s" repeatCount="indefinite"/></line>
    <line x1="150" y1="150" x2="215" y2="85"><animate attributeName="stroke-dashoffset" from="0" to="-20" dur="1.8s" repeatCount="indefinite"/></line>
    <line x1="150" y1="150" x2="230" y2="215"><animate attributeName="stroke-dashoffset" from="0" to="-20" dur="2.6s" repeatCount="indefinite"/></line>
    <line x1="70" y1="220" x2="230" y2="215"><animate attributeName="stroke-dashoffset" from="0" to="-20" dur="2.1s" repeatCount="indefinite"/></line>
  </g>
  <!-- right network -->
  <g stroke="#ffffff" stroke-opacity="0.28" stroke-width="1.4" stroke-dasharray="4 6" fill="none">
    <line x1="830" y1="70" x2="750" y2="150"><animate attributeName="stroke-dashoffset" from="0" to="-20" dur="2.3s" repeatCount="indefinite"/></line>
    <line x1="750" y1="150" x2="830" y2="220"><animate attributeName="stroke-dashoffset" from="0" to="-20" dur="2s" repeatCount="indefinite"/></line>
    <line x1="830" y1="70" x2="685" y2="85"><animate attributeName="stroke-dashoffset" from="0" to="-20" dur="2.5s" repeatCount="indefinite"/></line>
    <line x1="750" y1="150" x2="685" y2="85"><animate attributeName="stroke-dashoffset" from="0" to="-20" dur="1.9s" repeatCount="indefinite"/></line>
    <line x1="750" y1="150" x2="670" y2="215"><animate attributeName="stroke-dashoffset" from="0" to="-20" dur="2.7s" repeatCount="indefinite"/></line>
    <line x1="830" y1="220" x2="670" y2="215"><animate attributeName="stroke-dashoffset" from="0" to="-20" dur="2.2s" repeatCount="indefinite"/></line>
  </g>

  <!-- nodes -->
  <g fill="#8be9ff">
    <circle cx="70" cy="70" r="4"><animate attributeName="r" values="3;6;3" dur="3s" repeatCount="indefinite"/></circle>
    <circle cx="150" cy="150" r="4"><animate attributeName="r" values="3;6;3" dur="3.4s" begin="0.5s" repeatCount="indefinite"/></circle>
    <circle cx="70" cy="220" r="4"><animate attributeName="r" values="3;6;3" dur="2.8s" begin="1s" repeatCount="indefinite"/></circle>
    <circle cx="215" cy="85" r="4"><animate attributeName="r" values="3;6;3" dur="3.2s" begin="0.3s" repeatCount="indefinite"/></circle>
    <circle cx="230" cy="215" r="4"><animate attributeName="r" values="3;6;3" dur="3.6s" begin="1.2s" repeatCount="indefinite"/></circle>
  </g>
  <g fill="#e0b3ff">
    <circle cx="830" cy="70" r="4"><animate attributeName="r" values="3;6;3" dur="3.1s" begin="0.2s" repeatCount="indefinite"/></circle>
    <circle cx="750" cy="150" r="4"><animate attributeName="r" values="3;6;3" dur="3.5s" begin="0.8s" repeatCount="indefinite"/></circle>
    <circle cx="830" cy="220" r="4"><animate attributeName="r" values="3;6;3" dur="2.9s" begin="1.4s" repeatCount="indefinite"/></circle>
    <circle cx="685" cy="85" r="4"><animate attributeName="r" values="3;6;3" dur="3.3s" begin="0.6s" repeatCount="indefinite"/></circle>
    <circle cx="670" cy="215" r="4"><animate attributeName="r" values="3;6;3" dur="3.7s" begin="1.1s" repeatCount="indefinite"/></circle>
  </g>

  <!-- name -->
  <text x="450" y="120" text-anchor="middle" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="58" font-weight="700" fill="#ffffff" opacity="0">
    Khushi Chile
    <animate attributeName="opacity" from="0" to="1" dur="1.4s" fill="freeze"/>
    <animateTransform attributeName="transform" type="translate" from="0 16" to="0 0" dur="1.4s" fill="freeze"/>
  </text>

  <!-- cycling roles -->
  <g font-family="Consolas, 'Courier New', monospace" font-size="26" font-weight="600" text-anchor="middle" fill="url(#accent)">
    <text x="450" y="168" opacity="0">&gt; Python Developer
      <animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.05;0.30;0.34;1" dur="9s" begin="0s" repeatCount="indefinite"/>
    </text>
    <text x="450" y="168" opacity="0">&gt; QA Engineer
      <animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.05;0.30;0.34;1" dur="9s" begin="3s" repeatCount="indefinite"/>
    </text>
    <text x="450" y="168" opacity="0">&gt; AI / ML Builder
      <animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.05;0.30;0.34;1" dur="9s" begin="6s" repeatCount="indefinite"/>
    </text>
  </g>

  <text x="450" y="205" text-anchor="middle" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" fill="#d9d4f2">Mumbai, India  ·  MCA @ Bharati Vidyapeeth</text>

  <!-- open to work pill -->
  <rect x="380" y="224" width="140" height="28" rx="14" fill="#2ea44f" fill-opacity="0.22" stroke="#7ee2a8" stroke-opacity="0.6"/>
  <circle cx="400" cy="238" r="5" fill="#7ee2a8">
    <animate attributeName="opacity" values="1;0.25;1" dur="1.8s" repeatCount="indefinite"/>
  </circle>
  <text x="414" y="243" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="700" letter-spacing="1" fill="#7ee2a8">OPEN TO WORK</text>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
