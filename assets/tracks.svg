<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 250" width="900" height="250" role="img" aria-label="Python feeds QA, QA feeds AI/ML, and AI/ML feeds back into Python" xmlns:c2pa="http://c2pa.org/manifest">
  <!-- connectors -->
  <g stroke="#8b8fa3" stroke-width="2" stroke-dasharray="6 6" fill="none">
    <line x1="276" y1="95" x2="326" y2="95"><animate attributeName="stroke-dashoffset" from="0" to="-24" dur="1.4s" repeatCount="indefinite"/></line>
    <line x1="571" y1="95" x2="621" y2="95"><animate attributeName="stroke-dashoffset" from="0" to="-24" dur="1.4s" repeatCount="indefinite"/></line>
    <path d="M745,160 C745,240 155,240 155,168"><animate attributeName="stroke-dashoffset" from="0" to="-24" dur="2s" repeatCount="indefinite"/></path>
  </g>
  <g fill="#8b8fa3">
    <polygon points="326,89 338,95 326,101"/>
    <polygon points="621,89 633,95 621,101"/>
    <polygon points="149,170 155,158 161,170"/>
  </g>
  <text x="450" y="228" text-anchor="middle" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#8b8fa3" letter-spacing="1">FEEDBACK LOOP</text>

  <!-- travelling dots -->
  <circle r="4.5" fill="#f5c542"><animateMotion path="M276,95 L326,95" dur="1.6s" repeatCount="indefinite"/></circle>
  <circle r="4.5" fill="#f5c542"><animateMotion path="M571,95 L621,95" dur="1.6s" begin="0.8s" repeatCount="indefinite"/></circle>
  <circle r="4.5" fill="#f5c542"><animateMotion path="M745,160 C745,240 155,240 155,168" dur="4s" repeatCount="indefinite"/></circle>

  <!-- card 1: Python -->
  <rect x="40" y="30" width="230" height="130" rx="18" fill="#2d6aa3"/>
  <rect x="40" y="30" width="230" height="130" rx="18" fill="none" stroke="#ffffff" stroke-width="2">
    <animate attributeName="stroke-opacity" values="0.15;0.7;0.15" dur="3s" repeatCount="indefinite"/>
  </rect>
  <text x="155" y="78" text-anchor="middle" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#ffffff" letter-spacing="1">PYTHON</text>
  <text x="155" y="108" text-anchor="middle" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#ffffff" fill-opacity="0.92">Django · NumPy · Pandas</text>
  <text x="155" y="130" text-anchor="middle" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#ffffff" fill-opacity="0.92">Clean, testable code</text>

  <!-- card 2: QA -->
  <rect x="335" y="30" width="230" height="130" rx="18" fill="#6a4bb0"/>
  <rect x="335" y="30" width="230" height="130" rx="18" fill="none" stroke="#ffffff" stroke-width="2">
    <animate attributeName="stroke-opacity" values="0.15;0.7;0.15" dur="3s" begin="1s" repeatCount="indefinite"/>
  </rect>
  <text x="450" y="78" text-anchor="middle" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#ffffff" letter-spacing="1">QA ENGINEERING</text>
  <text x="450" y="108" text-anchor="middle" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#ffffff" fill-opacity="0.92">Test cases · Bug reports</text>
  <text x="450" y="130" text-anchor="middle" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#ffffff" fill-opacity="0.92">Input validation</text>

  <!-- card 3: AI/ML -->
  <rect x="630" y="30" width="230" height="130" rx="18" fill="#d9540f"/>
  <rect x="630" y="30" width="230" height="130" rx="18" fill="none" stroke="#ffffff" stroke-width="2">
    <animate attributeName="stroke-opacity" values="0.15;0.7;0.15" dur="3s" begin="2s" repeatCount="indefinite"/>
  </rect>
  <text x="745" y="78" text-anchor="middle" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#ffffff" letter-spacing="1">AI / ML</text>
  <text x="745" y="108" text-anchor="middle" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#ffffff" fill-opacity="0.92">ML models · NLP</text>
  <text x="745" y="130" text-anchor="middle" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#ffffff" fill-opacity="0.92">Predictive analytics</text>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
