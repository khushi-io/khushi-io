<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 140" width="900" height="140" role="img" aria-label="Khushi Chile" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <linearGradient id="shimmer" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="450" y2="0" spreadMethod="repeat">
      <stop offset="0" stop-color="#8b5cf6"/>
      <stop offset="0.33" stop-color="#3b82f6"/>
      <stop offset="0.66" stop-color="#ec4899"/>
      <stop offset="1" stop-color="#8b5cf6"/>
      <animateTransform attributeName="gradientTransform" type="translate" from="0 0" to="450 0" dur="5s" repeatCount="indefinite"/>
    </linearGradient>
    <linearGradient id="underline" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8b5cf6" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#ec4899"/>
      <stop offset="1" stop-color="#3b82f6" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-40%" width="140%" height="180%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- soft glow copy of the name -->
  <text x="450" y="92" text-anchor="middle" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="84" font-weight="800" fill="url(#shimmer)" opacity="0" filter="url(#glow)">
    Khushi Chile
    <animate attributeName="opacity" values="0;0.35;0.2;0.35" keyTimes="0;0.3;0.65;1" dur="4s" begin="1s" repeatCount="indefinite"/>
  </text>

  <!-- the name with shimmering gradient -->
  <text x="450" y="92" text-anchor="middle" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="84" font-weight="800" fill="url(#shimmer)" opacity="0">
    Khushi Chile
    <animate attributeName="opacity" from="0" to="1" dur="1.2s" fill="freeze"/>
    <animateTransform attributeName="transform" type="translate" from="0 18" to="0 0" dur="1.2s" fill="freeze"/>
  </text>

  <!-- underline that draws itself, then a dot travels along it -->
  <rect x="230" y="112" width="440" height="3" rx="1.5" fill="url(#underline)" opacity="0">
    <animate attributeName="opacity" from="0" to="1" dur="0.8s" begin="0.8s" fill="freeze"/>
  </rect>
  <circle r="4.5" fill="#ec4899" filter="url(#glow)">
    <animateMotion path="M230,113.5 L670,113.5" dur="3s" begin="1.6s" repeatCount="indefinite"/>
  </circle>

  <!-- twinkling sparkles -->
  <g fill="#f59e0b">
    <path d="M110,40 l3,9 9,3 -9,3 -3,9 -3,-9 -9,-3 9,-3z">
      <animateTransform attributeName="transform" type="scale" values="1;0.2;1" dur="2.4s" repeatCount="indefinite" additive="sum"/>
      <animate attributeName="opacity" values="1;0.2;1" dur="2.4s" repeatCount="indefinite"/>
    </path>
    <path d="M800,70 l2.5,7.5 7.5,2.5 -7.5,2.5 -2.5,7.5 -2.5,-7.5 -7.5,-2.5 7.5,-2.5z">
      <animate attributeName="opacity" values="0.2;1;0.2" dur="2s" begin="0.6s" repeatCount="indefinite"/>
    </path>
    <path d="M165,100 l2,6 6,2 -6,2 -2,6 -2,-6 -6,-2 6,-2z">
      <animate attributeName="opacity" values="1;0.15;1" dur="1.8s" begin="0.3s" repeatCount="indefinite"/>
    </path>
    <path d="M735,22 l2,6 6,2 -6,2 -2,6 -2,-6 -6,-2 6,-2z">
      <animate attributeName="opacity" values="0.15;1;0.15" dur="2.2s" begin="1s" repeatCount="indefinite"/>
    </path>
  </g>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
